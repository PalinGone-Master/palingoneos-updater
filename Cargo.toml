[package]
name = "palin-gone-os-updater"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Gestionnaire de mise à jour de PalinGoneOS"
repository = "https://github.com/palingoneos/palingoneos-updater"

[build-dependencies]
xdgen = "0.1"

[dependencies]
i18n-embed-fl = "0.10"
rust-embed = "8.11"
tokio = { version = "1.52.0", features = ["full"] }
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
branch = "master" # ou un 'rev = "..."' si vous préférez un commit figé
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
]

# Uncomment to test a locally-cloned libcosmic
